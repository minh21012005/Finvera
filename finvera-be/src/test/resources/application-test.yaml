spring:
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    time-zone: UTC

finvera:
  market:
    timezone: Asia/Ho_Chi_Minh
    freshness:
      index-contracted-delay: PT0S
    provider:
      mode: fixture
      live-enabled: false
  stock:
    provider:
      mode: fixture
      quote-live-enabled: false
      fundamentals-enabled: false
      corporate-actions-enabled: false
      sector-basis-enabled: false
    freshness:
      quote-contracted-delay: PT0S
    chart:
      max-window: 2Y
