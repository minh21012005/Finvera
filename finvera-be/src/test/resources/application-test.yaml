spring:
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    time-zone: UTC

finvera:
  market:
    timezone: Asia/Ho_Chi_Minh
    freshness:
      index-contracted-delay: PT0S
    provider:
      mode: fixture
  stock:
    provider:
      sector-basis-enabled: false
    freshness:
      quote-contracted-delay: PT0S
    chart:
      max-window: 2Y
  research:
    internal-api-key: test-internal-api-key
  analyst:
    internal-api-key: test-internal-api-key
