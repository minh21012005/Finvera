spring:
  application:
    name: finvera-be
  datasource:
    url: ${FINVERA_DATABASE_URL}
    username: ${FINVERA_DATABASE_USERNAME}
    password: ${FINVERA_DATABASE_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    time-zone: UTC

server:
  # Private deployment invariant: Tailscale Serve (or an equivalent local reverse
  # proxy) is the only ingress. Do not bind Spring directly to a LAN/WAN address.
  address: 127.0.0.1
  servlet:
    session:
      cookie:
        name: FINVERA_SESSION
        http-only: true
        secure: true
        same-site: strict
      timeout: 30m

finvera:
  security:
    owner:
      id: ${FINVERA_OWNER_ID}
      username: ${FINVERA_OWNER_USERNAME}
      password-hash: ${FINVERA_OWNER_PASSWORD_HASH}
  market:
    timezone: Asia/Ho_Chi_Minh
    freshness:
      index-contracted-delay: ${FINVERA_MARKET_INDEX_CONTRACTED_DELAY}
    provider:
      mode: ${FINVERA_MARKET_PROVIDER_MODE:fixture}
      live-enabled: ${FINVERA_MARKET_PROVIDER_LIVE_ENABLED:false}
      tcbs:
        base-url: ${FINVERA_TCBS_BASE_URL:https://openapi.tcbs.com.vn}
        api-key: ${FINVERA_TCBS_API_KEY:}
        poll-interval-ms: ${FINVERA_MARKET_TCBS_POLL_INTERVAL_MS:60000}
    fixture:
      bootstrap-enabled: ${FINVERA_MARKET_FIXTURE_BOOTSTRAP_ENABLED:false}
    import:
      enabled: ${FINVERA_MARKET_IMPORT_ENABLED:false}
      package-path: ${FINVERA_MARKET_IMPORT_PACKAGE_PATH:}
      instrument-reference:
        enabled: ${FINVERA_MARKET_IMPORT_INSTRUMENT_REFERENCE_ENABLED:false}
        package-path: ${FINVERA_MARKET_IMPORT_INSTRUMENT_REFERENCE_PACKAGE_PATH:}
  stock:
    provider:
      quote-live-enabled: ${FINVERA_STOCK_QUOTE_LIVE_ENABLED:false}
      sector-basis-enabled: ${FINVERA_STOCK_SECTOR_BASIS_ENABLED:false}
    freshness:
      quote-contracted-delay: ${FINVERA_STOCK_QUOTE_CONTRACTED_DELAY:}
    chart:
      max-window: ${FINVERA_STOCK_CHART_MAX_WINDOW:2Y}
    import:
      daily-bar:
        enabled: ${FINVERA_STOCK_IMPORT_DAILY_BAR_ENABLED:false}
        package-path: ${FINVERA_STOCK_IMPORT_DAILY_BAR_PACKAGE_PATH:}
      fundamentals:
        enabled: ${FINVERA_STOCK_IMPORT_FUNDAMENTALS_ENABLED:false}
        package-path: ${FINVERA_STOCK_IMPORT_FUNDAMENTALS_PACKAGE_PATH:}
      sector-reference:
        enabled: ${FINVERA_STOCK_IMPORT_SECTOR_REFERENCE_ENABLED:false}
        package-path: ${FINVERA_STOCK_IMPORT_SECTOR_REFERENCE_PACKAGE_PATH:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
