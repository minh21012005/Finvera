spring:
  application:
    name: finvera-be
  datasource:
    url: ${FINVERA_DATABASE_URL}
    username: ${FINVERA_DATABASE_USERNAME}
    password: ${FINVERA_DATABASE_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    time-zone: UTC

server:
  # Private deployment invariant: Tailscale Serve (or an equivalent local reverse
  # proxy) is the only ingress. Do not bind Spring directly to a LAN/WAN address.
  address: 127.0.0.1
  servlet:
    session:
      cookie:
        name: FINVERA_SESSION
        http-only: true
        secure: true
        same-site: strict
      timeout: 30m

finvera:
  security:
    owner:
      id: ${FINVERA_OWNER_ID}
      username: ${FINVERA_OWNER_USERNAME}
      password-hash: ${FINVERA_OWNER_PASSWORD_HASH}
  data-retention:
    cleanup:
      enabled: ${FINVERA_DATA_RETENTION_CLEANUP_ENABLED:false}
      audit-retention-days: ${FINVERA_DATA_RETENTION_AUDIT_DAYS:30}
      live-retention-days: ${FINVERA_DATA_RETENTION_LIVE_DAYS:7}
      eod-calculation-retention-days: ${FINVERA_DATA_RETENTION_EOD_CALCULATION_DAYS:252}
      revision-retention-days: ${FINVERA_DATA_RETENTION_REVISION_DAYS:30}
  market:
    timezone: Asia/Ho_Chi_Minh
    freshness:
      index-contracted-delay: ${FINVERA_MARKET_INDEX_CONTRACTED_DELAY}
    provider:
      mode: ${FINVERA_MARKET_PROVIDER_MODE:fixture}
    regime:
      # Minimum fraction of the eligible breadth universe that must be classified
      # (advancing + declining + unchanged) before the BREADTH component is
      # admitted into a market-regime-v2 assessment. Below the floor the
      # component is withheld and the rule's own publishability disclosures apply.
      min-breadth-classified-fraction: ${FINVERA_MARKET_REGIME_MIN_BREADTH_CLASSIFIED_FRACTION:0.5}
    live-overlay:
      tcbs:
        enabled: ${FINVERA_TCBS_LIVE_ENABLED:false}
        base-url: ${FINVERA_TCBS_BASE_URL:https://openapi.tcbs.com.vn}
        websocket-url: ${FINVERA_TCBS_WEBSOCKET_URL:wss://openapi.tcbs.com.vn/ws/thesis/v1/stream/normal}
        api-key: ${FINVERA_TCBS_API_KEY:}
        heartbeat-interval: ${FINVERA_TCBS_HEARTBEAT_INTERVAL:2s}
        reconnect-max-delay: ${FINVERA_TCBS_RECONNECT_MAX_DELAY:30s}
        max-dynamic-symbols: ${FINVERA_TCBS_MAX_DYNAMIC_SYMBOLS:100}
    fixture:
      bootstrap-enabled: ${FINVERA_MARKET_FIXTURE_BOOTSTRAP_ENABLED:false}
    import:
      enabled: ${FINVERA_MARKET_IMPORT_ENABLED:false}
      package-path: ${FINVERA_MARKET_IMPORT_PACKAGE_PATH:}
      instrument-reference:
        enabled: ${FINVERA_MARKET_IMPORT_INSTRUMENT_REFERENCE_ENABLED:false}
        package-path: ${FINVERA_MARKET_IMPORT_INSTRUMENT_REFERENCE_PACKAGE_PATH:}
    eod-reconciliation:
      enabled: ${FINVERA_MARKET_EOD_RECONCILIATION_ENABLED:false}
  stock:
    provider:
      quote-live-enabled: ${FINVERA_STOCK_QUOTE_LIVE_ENABLED:false}
      sector-basis-enabled: ${FINVERA_STOCK_SECTOR_BASIS_ENABLED:false}
    freshness:
      quote-contracted-delay: ${FINVERA_STOCK_QUOTE_CONTRACTED_DELAY:}
    chart:
      max-window: ${FINVERA_STOCK_CHART_MAX_WINDOW:2Y}
    import:
      equity-profile:
        enabled: ${FINVERA_STOCK_IMPORT_EQUITY_PROFILE_ENABLED:false}
        package-path: ${FINVERA_STOCK_IMPORT_EQUITY_PROFILE_PACKAGE_PATH:}
      daily-bar:
        enabled: ${FINVERA_STOCK_IMPORT_DAILY_BAR_ENABLED:false}
        package-path: ${FINVERA_STOCK_IMPORT_DAILY_BAR_PACKAGE_PATH:}
      fundamentals:
        enabled: ${FINVERA_STOCK_IMPORT_FUNDAMENTALS_ENABLED:false}
        package-path: ${FINVERA_STOCK_IMPORT_FUNDAMENTALS_PACKAGE_PATH:}
      sector-reference:
        enabled: ${FINVERA_STOCK_IMPORT_SECTOR_REFERENCE_ENABLED:false}
        package-path: ${FINVERA_STOCK_IMPORT_SECTOR_REFERENCE_PACKAGE_PATH:}
    technical:
      warmup:
        enabled: ${FINVERA_STOCK_TECHNICAL_WARMUP_ENABLED:false}
    valuation:
      warmup:
        enabled: ${FINVERA_STOCK_VALUATION_WARMUP_ENABLED:false}
        # Recompute every instrument even when assessed today with unchanged inputs
        # (owner roll-out of a calculator fix within the same rule version).
        force: ${FINVERA_STOCK_VALUATION_WARMUP_FORCE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
