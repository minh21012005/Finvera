openapi: 3.1.0
info:
  title: Finvera Stock Detail API
  version: 1.0.0
  description: >-
    Private Spring Boot contract for Feature 002 (Stock Detail and Analysis).
    While TCBS iFlash and Vnstock-derived data are active, only the configured
    deployment owner may call these endpoints (SEC-001, SEC-004).

    The stock detail is exposed as five independently retrievable sections plus a
    symbol lookup, so that one section's unavailability never blocks the others
    (FR-012). Every section response carries asOf, dataStatus, reasonCodes, and a
    coherenceKey; a client compares coherenceKey across sections to detect a
    mixed snapshot rather than rendering one silently (NFR-003, research R-009).

    Facts are null when unavailable and MUST never be replaced by zero
    (DATA-007). A degraded but usable section is HTTP 200 with a section-level
    status, not an error. Authoritative decimals are transported as JSON strings
    to preserve declared precision across languages (DATA-003).
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: Stock
    description: Single-stock research sections.
paths:
  /stocks:
    get:
      operationId: searchStocks
      summary: Look up supported stocks by symbol or name
      description: >-
        Supports the symbol lookup required by FR-016. Returns only instruments
        Finvera currently supports; it never invents a placeholder entry for an
        unknown symbol.
      tags: [Stock]
      parameters:
        - name: query
          in: query
          required: true
          description: Symbol prefix or name fragment; case-insensitive.
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Zero or more matches. An empty list is a valid answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockSearchResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /stocks/{symbol}:
    get:
      operationId: getStockOverview
      summary: Get one stock's current price, change, and session context
      tags: [Stock]
      parameters:
        - $ref: "#/components/parameters/Symbol"
      responses:
        "200":
          description: Complete or explicitly degraded overview (FR-001, FR-013).
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockOverviewResponse"
        "304": { description: The client's ETag still identifies the latest response. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/StockNotSupported" }
        "500": { $ref: "#/components/responses/ServerError" }

  /stocks/{symbol}/chart:
    get:
      operationId: getStockChart
      summary: Get the daily OHLCV series for a bounded lookback window
      description: >-
        FR-003. The series declares one adjustment status for the whole window;
        adjusted and unadjusted values are never mixed within a series
        (DATA-008, research R-004).
      tags: [Stock]
      parameters:
        - $ref: "#/components/parameters/Symbol"
        - name: window
          in: query
          required: false
          description: Bounded lookback window.
          schema:
            type: string
            enum: [ "1M", "3M", "6M", "1Y", "2Y" ]
            default: "1Y"
      responses:
        "200":
          description: Complete or explicitly degraded series.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockChartResponse"
        "304": { description: Unchanged. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/StockNotSupported" }
        "500": { $ref: "#/components/responses/ServerError" }

  /stocks/{symbol}/technical:
    get:
      operationId: getStockTechnical
      summary: Get deterministic technical indicator results
      description: >-
        FR-005 and FR-006. Every indicator is computed under
        technical-indicators-v1. An indicator whose minimum bar count is not met
        is returned as unavailable with a reason; the remaining indicators stay
        usable.
      tags: [Stock]
      parameters:
        - $ref: "#/components/parameters/Symbol"
      responses:
        "200":
          description: Indicator results, individually available or unavailable.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockTechnicalResponse"
        "304": { description: Unchanged. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/StockNotSupported" }
        "500": { $ref: "#/components/responses/ServerError" }

  /stocks/{symbol}/fundamentals:
    get:
      operationId: getStockFundamentals
      summary: Get the latest accepted fundamental reporting period
      description: FR-007. Identifies the reporting period, its kind, and its audit status.
      tags: [Stock]
      parameters:
        - $ref: "#/components/parameters/Symbol"
      responses:
        "200":
          description: Fundamental metrics, or an explicit unavailable state.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockFundamentalsResponse"
        "304": { description: Unchanged. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/StockNotSupported" }
        "500": { $ref: "#/components/responses/ServerError" }

  /stocks/{symbol}/valuation:
    get:
      operationId: getStockValuation
      summary: Get the deterministic valuation metrics and classification
      description: >-
        FR-008, FR-009, FR-010. Computed under valuation-v1. classification,
        score, and confidence are present together or absent together; a
        withheld assessment carries reasonCodes and never a guessed label.
      tags: [Stock]
      parameters:
        - $ref: "#/components/parameters/Symbol"
      responses:
        "200":
          description: A published or explicitly withheld assessment.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockValuationResponse"
        "304": { description: Unchanged. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/StockNotSupported" }
        "500": { $ref: "#/components/responses/ServerError" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: FINVERA_SESSION
      description: >-
        The owner session established by the Feature 001 private owner access
        contract. No separate authentication path exists for this feature
        (SEC-004).

  parameters:
    Symbol:
      name: symbol
      in: path
      required: true
      description: Normalized uppercase ticker symbol.
      schema:
        type: string
        pattern: "^[A-Z0-9]{3,10}$"

  headers:
    ETag:
      description: Validator derived from the section's accepted revision vector.
      schema:
        type: string

  responses:
    BadRequest:
      description: The request parameters are malformed.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthenticated:
      description: Missing, expired, or invalid private owner session.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: The authenticated caller is not the configured deployment owner.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    StockNotSupported:
      description: >-
        The symbol is unknown or not supported by Finvera's accepted reference
        data. No placeholder or fabricated stock is returned (FR-016).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ServerError:
      description: The service could not assemble even a degraded section.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    Decimal:
      type: string
      pattern: "^-?[0-9]+(\\.[0-9]+)?$"
      description: >-
        An exact decimal transported as a string. Never a JSON number, because
        IEEE-754 parsing would silently alter the declared precision of a
        financial value (DATA-003).
    Instant:
      type: string
      format: date-time
      description: UTC instant.
    DataStatus:
      type: string
      enum: [CURRENT, DELAYED, STALE, PARTIAL, UNAVAILABLE]
    Applicability:
      type: string
      enum: [DEFINED, NOT_APPLICABLE, MISSING]
      description: >-
        DEFINED carries a value. NOT_APPLICABLE means the quantity is undefined
        for this company. MISSING means an input was not accepted. None of them
        is ever rendered as zero (DATA-007).
    AdjustmentStatus:
      type: string
      enum: [ADJUSTED, RAW, NOT_APPLICABLE, UNKNOWN]
    SessionState:
      type: string
      enum: [PRE_OPEN, OPEN, BREAK, INTERRUPTED, CLOSED, NON_TRADING_DAY, UNKNOWN]
    Direction:
      type: string
      enum: [UP, DOWN, UNCHANGED]
      description: >-
        Derived from unrounded values, and always accompanied by a textual or
        iconographic cue so meaning does not depend on colour (NFR-005).
    CoherenceKey:
      type: string
      pattern: "^[0-9a-f]{32}$"
      description: >-
        Change detector for the accepted revision vector behind this section.
        Clients compare it across sections to detect a mixed snapshot. It is not
        a security token and grants nothing.
    ReasonCode:
      type: string
      description: >-
        Stable machine-readable reason. The UI maps codes to localized copy;
        codes never carry provider payloads, credentials, or private data.
      examples:
        - INSUFFICIENT_HISTORY
        - ADJUSTMENT_BASIS_UNAVAILABLE
        - FUNDAMENTALS_STALE
        - SECTOR_BASIS_INSUFFICIENT
        - SOURCE_CONFLICT
        - PROVIDER_AUTH_REQUIRED
    SectionMeta:
      type: object
      additionalProperties: false
      required: [contractVersion, symbol, asOf, dataStatus, coherenceKey, reasonCodes, timezone]
      properties:
        contractVersion:
          type: string
          const: "1.0"
        symbol:
          type: string
        asOf:
          $ref: "#/components/schemas/Instant"
        tradingDate:
          type: string
          format: date
          description: Vietnamese market trading date this section describes.
        timezone:
          type: string
          const: Asia/Ho_Chi_Minh
        dataStatus:
          $ref: "#/components/schemas/DataStatus"
        coherenceKey:
          $ref: "#/components/schemas/CoherenceKey"
        sources:
          type: array
          description: Allowlisted source labels only; never raw provider metadata.
          items:
            type: string
        reasonCodes:
          type: array
          items:
            $ref: "#/components/schemas/ReasonCode"

    StockSearchResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, results]
      properties:
        contractVersion: { type: string, const: "1.0" }
        results:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [symbol, companyName, exchange, listingStatus]
            properties:
              symbol: { type: string }
              companyName: { type: string }
              exchange: { type: string, enum: [HOSE, HNX, UPCOM] }
              sector: { type: [string, "null"] }
              listingStatus:
                type: string
                enum: [LISTED, SUSPENDED, HALTED, DELISTED, UNKNOWN]

    StockOverviewResponse:
      type: object
      additionalProperties: false
      required: [meta, profile, price, session]
      properties:
        meta: { $ref: "#/components/schemas/SectionMeta" }
        profile:
          type: object
          additionalProperties: false
          required: [symbol, companyName, exchange, listingStatus]
          properties:
            symbol: { type: string }
            companyName: { type: string }
            companyNameEn: { type: [string, "null"] }
            exchange: { type: string, enum: [HOSE, HNX, UPCOM] }
            sector: { type: [string, "null"] }
            sectorScheme: { type: [string, "null"] }
            listingStatus:
              type: string
              enum: [LISTED, SUSPENDED, HALTED, DELISTED, UNKNOWN]
            sharesOutstanding: { type: [integer, "null"], minimum: 0 }
        price:
          type: object
          additionalProperties: false
          required: [currency, direction, applicability]
          properties:
            currency: { type: string, const: VND }
            last: { $ref: "#/components/schemas/NullableDecimal" }
            referencePrice:
              allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]
              description: The previous valid official close used as the change basis (FR-002).
            absoluteChange: { $ref: "#/components/schemas/NullableDecimal" }
            percentageChange:
              allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]
              description: Percentage points, e.g. "1.250000" means 1.25 percent.
            direction: { $ref: "#/components/schemas/Direction" }
            volume: { type: [integer, "null"], minimum: 0 }
            valueVnd: { $ref: "#/components/schemas/NullableDecimal" }
            marketCapVnd: { $ref: "#/components/schemas/NullableDecimal" }
            applicability: { $ref: "#/components/schemas/Applicability" }
            changeBasisReason:
              type: [string, "null"]
              description: >-
                Present when a change field is unavailable because the reference
                basis could not be established (FR-002).
        session:
          type: object
          additionalProperties: false
          required: [state, tradingDate]
          properties:
            state: { $ref: "#/components/schemas/SessionState" }
            tradingDate: { type: string, format: date }
            calendarVersion: { type: [string, "null"] }

    NullableDecimal:
      oneOf:
        - $ref: "#/components/schemas/Decimal"
        - type: "null"

    StockChartResponse:
      type: object
      additionalProperties: false
      required: [meta, window, adjustmentStatus, bars]
      properties:
        meta: { $ref: "#/components/schemas/SectionMeta" }
        window: { type: string, enum: ["1M", "3M", "6M", "1Y", "2Y"] }
        adjustmentStatus:
          allOf: [{ $ref: "#/components/schemas/AdjustmentStatus" }]
          description: >-
            Applies to the whole series. A series is never partly adjusted
            (DATA-008).
        bars:
          type: array
          description: Ascending by tradingDate. Non-trading days are absent, never padded.
          items:
            type: object
            additionalProperties: false
            required: [tradingDate, open, high, low, close]
            properties:
              tradingDate: { type: string, format: date }
              open: { $ref: "#/components/schemas/Decimal" }
              high: { $ref: "#/components/schemas/Decimal" }
              low: { $ref: "#/components/schemas/Decimal" }
              close: { $ref: "#/components/schemas/Decimal" }
              volume: { type: [integer, "null"], minimum: 0 }

    StockTechnicalResponse:
      type: object
      additionalProperties: false
      required: [meta, ruleVersion, adjustmentStatus, indicators]
      properties:
        meta: { $ref: "#/components/schemas/SectionMeta" }
        ruleVersion: { type: string, const: "technical-indicators-v1" }
        adjustmentStatus: { $ref: "#/components/schemas/AdjustmentStatus" }
        disclaimerCode:
          type: string
          const: QUANTITATIVE_DECISION_SUPPORT
          description: >-
            The UI must render copy stating these are calculated values, not
            trading instructions (FR-015).
        indicators:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [indicatorCode, applicability, components, requiredBars, availableBars]
            properties:
              indicatorCode:
                type: string
                enum: [MA20, MA50, MA200, RSI14, MACD, BBANDS, ATR14, AVG_VOLUME20, RELATIVE_VOLUME]
              applicability: { $ref: "#/components/schemas/Applicability" }
              requiredBars: { type: integer, minimum: 1 }
              availableBars: { type: integer, minimum: 0 }
              windowStartDate: { type: [string, "null"], format: date }
              windowEndDate: { type: [string, "null"], format: date }
              reasonCode: { type: [string, "null"] }
              components:
                type: array
                description: Empty when the indicator is unavailable.
                items:
                  type: object
                  additionalProperties: false
                  required: [componentCode, unit, applicability]
                  properties:
                    componentCode:
                      type: string
                      enum: [VALUE, UPPER, MIDDLE, LOWER, BANDWIDTH, MACD_LINE, SIGNAL, HISTOGRAM, PERCENT_OF_CLOSE]
                    value: { $ref: "#/components/schemas/NullableDecimal" }
                    unit: { type: string, enum: [VND, PERCENT, RATIO, SHARES, POINTS] }
                    displayPrecision: { type: integer, minimum: 0, maximum: 6 }
                    applicability: { $ref: "#/components/schemas/Applicability" }
                    reasonCode: { type: [string, "null"] }

    StockFundamentalsResponse:
      type: object
      additionalProperties: false
      required: [meta, period, metrics]
      properties:
        meta: { $ref: "#/components/schemas/SectionMeta" }
        period:
          type: [object, "null"]
          additionalProperties: false
          required: [label, periodType, fiscalYear, periodStart, periodEnd, reportKind, auditStatus, currency]
          properties:
            label: { type: string, examples: ["2026-Q2"] }
            periodType: { type: string, enum: [ANNUAL, QUARTER] }
            fiscalYear: { type: integer }
            fiscalQuarter: { type: [integer, "null"], minimum: 1, maximum: 4 }
            periodStart: { type: string, format: date }
            periodEnd: { type: string, format: date }
            reportKind: { type: string, enum: [CONSOLIDATED, SEPARATE] }
            auditStatus: { type: string, enum: [AUDITED, REVIEWED, UNAUDITED, UNKNOWN] }
            currency: { type: string, const: VND }
            restated: { type: boolean, description: True when this revision supersedes an earlier filing (FR-014). }
        metrics:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [metricCode, unit, applicability]
            properties:
              metricCode:
                type: string
                description: A code from the versioned fundamental metric catalog.
                examples: [REVENUE, EPS, ROE, DEBT_TO_EQUITY, FREE_CASH_FLOW]
              value: { $ref: "#/components/schemas/NullableDecimal" }
              unit: { type: string, enum: [VND, SHARES, PERCENT, RATIO, COUNT] }
              displayPrecision: { type: integer, minimum: 0, maximum: 6 }
              applicability: { $ref: "#/components/schemas/Applicability" }
              reasonCode: { type: [string, "null"] }

    StockValuationResponse:
      type: object
      additionalProperties: false
      required: [meta, ruleVersion, published, metrics, basis]
      properties:
        meta: { $ref: "#/components/schemas/SectionMeta" }
        ruleVersion: { type: string, const: "valuation-v1" }
        published:
          type: boolean
          description: >-
            False when publishability conditions failed. classification, score,
            and confidence are then all null and meta.reasonCodes explains why
            (FR-010).
        classification:
          type: [string, "null"]
          enum: [UNDER_VALUED, FAIR_VALUED, OVER_VALUED, null]
        score:
          allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]
          description: Unrounded expensiveness score 0 to 100; higher is more expensive.
        displayedScore: { type: [integer, "null"], minimum: 0, maximum: 100 }
        confidence:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
          description: >-
            A data-quality measure, not a probability that the classification is
            correct. The UI must not present it as certainty.
        disclaimerCode:
          type: string
          const: QUANTITATIVE_DECISION_SUPPORT
          description: Required by FR-015; not a forecast, guarantee, or instruction.
        basis:
          type: object
          additionalProperties: false
          required: [usedOwnHistory, usedSector]
          properties:
            usedOwnHistory: { type: boolean }
            usedSector: { type: boolean }
            sector: { type: [string, "null"] }
            sectorScheme: { type: [string, "null"] }
            sectorSchemeVersion: { type: [string, "null"] }
            sectorConstituentCount: { type: [integer, "null"], minimum: 0 }
            historyPointCount: { type: [integer, "null"], minimum: 0 }
        metrics:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [metricCode, applicability]
            properties:
              metricCode: { type: string, enum: [PE, PB, EV_EBITDA, PEG, DIVIDEND_YIELD] }
              value: { $ref: "#/components/schemas/NullableDecimal" }
              applicability: { $ref: "#/components/schemas/Applicability" }
              ownHistoryPercentile: { $ref: "#/components/schemas/NullableDecimal" }
              sectorPercentile: { $ref: "#/components/schemas/NullableDecimal" }
              effectiveWeight: { $ref: "#/components/schemas/NullableDecimal" }
              reasonCode: { type: [string, "null"] }

    ErrorResponse:
      type: object
      description: RFC 9457 problem details, matching the Feature 001 error shape.
      additionalProperties: false
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail:
          type: string
          description: >-
            Safe explanatory text only. Never contains provider payloads,
            credentials, tokens, or stack traces.
        instance: { type: string, format: uri-reference }
        correlationId: { type: string }
        reasonCode: { $ref: "#/components/schemas/ReasonCode" }
