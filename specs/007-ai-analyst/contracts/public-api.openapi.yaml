openapi: 3.1.0
info:
  title: Finvera AI Analyst API
  version: 1.0.0
  description: >-
    Private Spring Boot contract for Feature 007. Only the configured
    deployment owner may call these endpoints (SEC-001), under the same
    session Features 001-006 already established. The browser calls only
    this API — never `finvera-ai` directly (docs/ARCHITECTURE.md B-1).

    Every state-changing request requires `X-CSRF-TOKEN`; a missing token
    is HTTP 403 with no state change. `/analyst/ask` streams
    (`text/event-stream`) to satisfy NFR-001. Every structured claim in an
    answer is attributed to the tool call that produced it and verified
    against that call's actual result (AI-001); every document/news claim
    carries Feature 006's citation shape unchanged. This feature creates no
    new financial/content data of its own (DATA-001) and requires no
    `Idempotency-Key` (research R-012): both endpoints are read/synthesis
    operations whose only side effect is an audit-log row.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: Analyst
    description: Tool-orchestrated question answering and deterministic-output explanation.

paths:
  /analyst/ask:
    post:
      operationId: askAnalyst
      summary: >-
        Ask a natural-language investment question and get a tool-grounded,
        streamed answer (FR-001 to FR-005, FR-010 to FR-015, orchestration-v1)
      description: >-
        Streams `text/event-stream` so the response begins within
        NFR-001's 20-second budget even if full generation takes longer.
        `tool_call` events report each allowlisted tool as it is invoked
        and resolves (FR-012); the final event's `refused = true` means no
        allowlisted tool could supply relevant information (AI-004) —
        never a fabricated answer. A natural-language screening criterion
        (US4) is asked through this same endpoint; the converted structured
        filters are surfaced in the matching `tool_call` event's
        `arguments` (FR-008, FR-009).
      tags: [Analyst]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AskAnalystRequest" }
      responses:
        "200":
          description: >-
            A stream of `AnalystStreamEvent` objects ending in one
            `type: final` event.
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/AnalystStreamEvent" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CsrfRequired" }
        "503": { $ref: "#/components/responses/AnalystUnavailable" }

  /analyst/explanations:
    post:
      operationId: explainOutput
      summary: >-
        Explain an existing deterministic output in plain language
        (FR-006, orchestration-v1 faithfulness check)
      description: >-
        Synchronous (not streamed): the caller already has the
        deterministic output's evidence factors (e.g. a signal's
        `evidenceFactors` from Feature 004's own response) and supplies
        them directly — no tool orchestration occurs. A response whose
        faithfulness check fails twice returns `verified = false` with a
        generic explanation-unavailable message (FR-006), never an
        explanation referencing a factor the caller did not supply.
      tags: [Analyst]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExplainRequest" }
      responses:
        "200":
          description: A verified explanation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExplainResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CsrfRequired" }
        "503": { $ref: "#/components/responses/AnalystUnavailable" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: FINVERA_SESSION
      description: >-
        The owner session established by the Feature 001 private owner
        access contract. No separate authentication path exists (SEC-001).

  responses:
    Unauthenticated:
      description: Missing, expired, or invalid private owner session.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    CsrfRequired:
      description: Missing or invalid `X-CSRF-TOKEN`; no state change occurred.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationError:
      description: The request failed input validation.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    AnalystUnavailable:
      description: >-
        `finvera-ai`'s orchestrator, an allowlisted tool's underlying
        feature, or the LLM provider is degraded or unavailable; answering
        is temporarily unavailable, never silently returned as if no tool
        applied (NFR-002).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    PriorTurn:
      type: object
      required: [question, answer]
      properties:
        question: { type: string }
        answer: { type: string }

    AskAnalystRequest:
      type: object
      required: [question]
      additionalProperties: false
      properties:
        question: { type: string, minLength: 1, maxLength: 2000 }
        symbol:
          type: string
          nullable: true
          description: >-
            Optional stock symbol the owner is currently viewing (e.g. from
            the stock-detail screen). Threaded through to the orchestrator
            as read-only context for tool-argument resolution (research
            R-005) — never a substitute for a symbol the model itself must
            extract from the question text when this is absent. Added here
            to match the already-delivered end-to-end field (finvera-be's
            `AskAnalystRequest`/`InternalAskRequest`, finvera-ai's
            `OrchestrateAskRequest.symbol`); found missing from this
            contract during code review (2026-08-21) — the contract, not
            the working feature, was the gap.
        priorTurns:
          type: array
          description: >-
            Optional prior turns from the current browser session (FR-013)
            — never server-persisted; omit for a standalone question.
          items: { $ref: "#/components/schemas/PriorTurn" }
          maxItems: 10

    ToolName:
      type: string
      enum:
        - MARKET
        - STOCK
        - TECHNICAL
        - FUNDAMENTAL
        - VALUATION
        - PORTFOLIO
        - NEWS
        - RESEARCH_RAG
        - SCREENING

    ToolCallEvent:
      type: object
      required: [sequenceNo, toolName, status]
      properties:
        sequenceNo: { type: integer }
        toolName: { $ref: "#/components/schemas/ToolName" }
        status: { type: string, enum: [STARTED, SUCCEEDED, FAILED] }
        arguments:
          type: object
          additionalProperties: true
          nullable: true
          description: >-
            The validated arguments actually used (FR-008 for the
            Screening tool — this is where a converted natural-language
            filter set is surfaced to the owner).
        failureReason: { type: string, nullable: true }

    StructuredClaim:
      type: object
      required: [claimText, sequenceNo, toolName, asOf]
      properties:
        claimText: { type: string }
        sequenceNo: { type: integer }
        toolName: { $ref: "#/components/schemas/ToolName" }
        sourceField:
          type: string
          description: >-
            Human-presentable label for the tool-response field this claim
            was verified against (research R-009's public-resolution
            note); e.g. "RSI (14-day)".
        asOf:
          type: string
          format: date-time
          description: >-
            The originating tool call's own as-of/effective time (DATA-002)
            — lets the owner judge freshness per claim; resolved from the
            internal `StructuredClaim.asOf` unmodified.

    SourceType:
      type: string
      enum: [DOCUMENT, NEWS_ARTICLE]

    DocumentClaim:
      type: object
      required: [claimText, sourceType, sourceId, sourceTitle, location, source]
      description: >-
        Identical shape to Feature 006's public `Citation` schema, resolved
        the same way (`finvera-be` resolves `chunkId` to this shape before
        emitting the final event).
      properties:
        claimText: { type: string }
        sourceType: { $ref: "#/components/schemas/SourceType" }
        sourceId: { type: string, format: uuid }
        sourceTitle: { type: string }
        location: { type: string }
        source: { type: string }

    AnalystFinalResult:
      type: object
      required: [answer, structuredClaims, documentClaims, refused, toolCallBoundReached]
      properties:
        answer: { type: string }
        structuredClaims:
          type: array
          items: { $ref: "#/components/schemas/StructuredClaim" }
        documentClaims:
          type: array
          items: { $ref: "#/components/schemas/DocumentClaim" }
        refused:
          type: boolean
          description: >-
            `true` when no allowlisted tool could supply relevant
            information (AI-004); `structuredClaims` and `documentClaims`
            MUST both be empty when `refused = true`.
        toolCallBoundReached:
          type: boolean
          description: >-
            `true` when the per-question tool-call bound was reached
            (FR-011); `answer` then discloses that the result is partial.

    AnalystStreamEvent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [tool_call, delta, final]
        toolCall:
          allOf: [{ $ref: "#/components/schemas/ToolCallEvent" }]
          nullable: true
        textDelta: { type: string, nullable: true }
        final:
          allOf: [{ $ref: "#/components/schemas/AnalystFinalResult" }]
          nullable: true

    ExplainRequest:
      type: object
      required: [outputType, evidenceFactors]
      additionalProperties: false
      properties:
        outputType:
          type: string
          enum: [SIGNAL, INDICATOR_READING, VALUATION_CLASSIFICATION, RISK_FACTOR]
        symbol: { type: string, nullable: true }
        evidenceFactors:
          type: array
          minItems: 1
          items:
            type: object
            required: [factorCode, description]
            properties:
              factorCode: { type: string }
              description: { type: string }

    ExplainResponse:
      type: object
      required: [explanation, verified]
      properties:
        explanation: { type: string }
        verified:
          type: boolean
          description: >-
            `false` means the generic explanation-unavailable state was
            returned instead of a faithfulness-check failure passed
            through (FR-006).

    ErrorResponse:
      type: object
      required: [type, title, status, reasonCode, correlationId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        reasonCode: { type: string }
        correlationId: { type: string }
