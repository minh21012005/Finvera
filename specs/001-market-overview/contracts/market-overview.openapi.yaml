openapi: 3.1.0
info:
  title: Finvera Market Overview API
  version: 1.0.0
  description: >-
    Private Spring Boot contract for Feature 001. While TCBS iFlash is active,
    only the configured deployment owner may call this endpoint. Facts are
    nullable when not available and MUST never be replaced by zero. A successful
    degraded view is returned as HTTP 200 with section-level status and reason codes.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /market/overview:
    get:
      operationId: getMarketOverview
      summary: Get the latest coherent Vietnamese market overview
      tags: [Market]
      responses:
        "200":
          description: Complete or explicitly degraded overview.
          headers:
            ETag:
              description: Validator for the assembled accepted revision.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketOverviewResponse"
        "304":
          description: The client's ETag still identifies the latest response.
        "401":
          description: Missing, expired, or invalid private owner session.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The authenticated caller is not the configured private-deployment owner.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The service could not assemble even a degraded response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: FINVERA_SESSION
  schemas:
    MarketOverviewResponse:
      type: object
      additionalProperties: false
      required:
        - contractVersion
        - generatedAt
        - tradingDate
        - timezone
        - dataStatus
        - session
        - indices
        - breadth
        - regime
        - warnings
      properties:
        contractVersion:
          type: string
          const: "1.0"
        generatedAt:
          $ref: "#/components/schemas/Instant"
        tradingDate:
          type: string
          format: date
          description: Accepted Vietnamese market trading date.
        timezone:
          type: string
          const: Asia/Ho_Chi_Minh
        dataStatus:
          $ref: "#/components/schemas/DataStatus"
        session:
          $ref: "#/components/schemas/MarketSession"
        indices:
          type: array
          minItems: 4
          maxItems: 4
          description: Stable order VN_INDEX, VN30, HNX_INDEX, UPCOM_INDEX.
          items:
            $ref: "#/components/schemas/IndexOverview"
        breadth:
          $ref: "#/components/schemas/BreadthOverview"
        regime:
          $ref: "#/components/schemas/RegimeOverview"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/DataWarning"
    MarketSession:
      type: object
      additionalProperties: false
      required: [state, tradingDate, asOf, calendarVersion]
      properties:
        state:
          $ref: "#/components/schemas/SessionState"
        tradingDate:
          type: string
          format: date
        asOf:
          $ref: "#/components/schemas/Instant"
        calendarVersion:
          type: string
          minLength: 1
        venueStates:
          type: array
          items:
            $ref: "#/components/schemas/VenueSession"
    VenueSession:
      type: object
      additionalProperties: false
      required: [venue, state]
      properties:
        venue:
          $ref: "#/components/schemas/Venue"
        state:
          $ref: "#/components/schemas/SessionState"
    IndexOverview:
      type: object
      additionalProperties: false
      required:
        - code
        - displayName
        - venue
        - dataStatus
        - direction
        - unit
        - currency
        - source
        - reasonCodes
      properties:
        code:
          $ref: "#/components/schemas/IndexCode"
        displayName:
          type: string
        venue:
          $ref: "#/components/schemas/Venue"
        dataStatus:
          $ref: "#/components/schemas/DataStatus"
        direction:
          oneOf:
            - $ref: "#/components/schemas/Direction"
            - type: "null"
        value:
          $ref: "#/components/schemas/NullableDecimal"
        absoluteChange:
          $ref: "#/components/schemas/NullableDecimal"
        percentageChange:
          $ref: "#/components/schemas/NullableDecimal"
          description: Percentage points; 1.25 means 1.25%.
        matchedVolume:
          oneOf:
            - type: integer
              format: int64
              minimum: 0
            - type: "null"
        matchedValueVnd:
          $ref: "#/components/schemas/NullableDecimal"
        unit:
          type: string
          const: INDEX_POINT
        currency:
          type: string
          const: VND
        tradingDate:
          oneOf:
            - type: string
              format: date
            - type: "null"
        asOf:
          oneOf:
            - $ref: "#/components/schemas/Instant"
            - type: "null"
        source:
          $ref: "#/components/schemas/SourceReference"
        revision:
          oneOf:
            - type: integer
              minimum: 1
            - type: "null"
        reasonCodes:
          type: array
          items:
            $ref: "#/components/schemas/ReasonCode"
    BreadthOverview:
      type: object
      additionalProperties: false
      required:
        - dataStatus
        - universeVersion
        - advancing
        - declining
        - unchanged
        - eligible
        - unclassified
        - source
        - reasonCodes
      properties:
        dataStatus:
          $ref: "#/components/schemas/DataStatus"
        advancing:
          $ref: "#/components/schemas/NullableCount"
        declining:
          $ref: "#/components/schemas/NullableCount"
        unchanged:
          $ref: "#/components/schemas/NullableCount"
        eligible:
          $ref: "#/components/schemas/NullableCount"
        unclassified:
          $ref: "#/components/schemas/NullableCount"
        universeVersion:
          type: string
          minLength: 1
        tradingDate:
          oneOf:
            - type: string
              format: date
            - type: "null"
        asOf:
          oneOf:
            - $ref: "#/components/schemas/Instant"
            - type: "null"
        source:
          $ref: "#/components/schemas/SourceReference"
        reasonCodes:
          type: array
          items:
            $ref: "#/components/schemas/ReasonCode"
    RegimeOverview:
      type: object
      additionalProperties: false
      required:
        - dataStatus
        - ruleVersion
        - label
        - score
        - confidence
        - confidenceMeaning
        - factors
        - source
        - reasonCodes
        - disclaimerCode
      properties:
        dataStatus:
          $ref: "#/components/schemas/DataStatus"
        ruleVersion:
          type: string
          const: market-regime-v1
        label:
          oneOf:
            - $ref: "#/components/schemas/RegimeLabel"
            - type: "null"
        score:
          $ref: "#/components/schemas/NullableScore"
        confidence:
          $ref: "#/components/schemas/NullableScore"
        confidenceMeaning:
          type: string
          const: ASSESSMENT_QUALITY_NOT_FORECAST_PROBABILITY
        tradingDate:
          oneOf:
            - type: string
              format: date
            - type: "null"
        asOf:
          oneOf:
            - $ref: "#/components/schemas/Instant"
            - type: "null"
        factors:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/RegimeFactor"
        source:
          $ref: "#/components/schemas/SourceReference"
        reasonCodes:
          type: array
          items:
            $ref: "#/components/schemas/ReasonCode"
        disclaimerCode:
          type: string
          const: QUANTITATIVE_DECISION_SUPPORT_NOT_INVESTMENT_ADVICE
    RegimeFactor:
      type: object
      additionalProperties: false
      required:
        - code
        - direction
        - descriptionCode
        - normalizedScore
        - effectiveWeight
        - contribution
        - observations
      properties:
        code:
          type: string
          enum: [TREND, BREADTH, MOMENTUM, LIQUIDITY, VOLATILITY]
        direction:
          type: string
          enum: [POSITIVE, NEGATIVE, NEUTRAL]
        descriptionCode:
          type: string
        normalizedScore:
          $ref: "#/components/schemas/NullableDecimal"
        effectiveWeight:
          $ref: "#/components/schemas/NullableDecimal"
        contribution:
          $ref: "#/components/schemas/NullableDecimal"
        observations:
          type: array
          items:
            $ref: "#/components/schemas/FactorObservation"
    FactorObservation:
      type: object
      additionalProperties: false
      required: [name, value, unit]
      properties:
        name:
          type: string
        value:
          $ref: "#/components/schemas/NullableDecimal"
        unit:
          type: string
    SourceReference:
      type: object
      additionalProperties: false
      required: [provider, dataset]
      properties:
        provider:
          type: string
          description: Public source label, never a credential or private endpoint.
        dataset:
          type: string
    DataWarning:
      type: object
      additionalProperties: false
      required: [code, severity, section]
      properties:
        code:
          $ref: "#/components/schemas/ReasonCode"
        severity:
          type: string
          enum: [INFO, WARNING, ERROR]
        section:
          type: string
          enum: [OVERVIEW, SESSION, INDEX, BREADTH, REGIME]
        subject:
          type: [string, "null"]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlationId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        correlationId:
          type: string
    DataStatus:
      type: string
      enum: [CURRENT, DELAYED, STALE, PARTIAL, UNAVAILABLE]
    SessionState:
      type: string
      enum: [PRE_OPEN, OPEN, BREAK, INTERRUPTED, CLOSED, NON_TRADING_DAY, UNKNOWN]
    Direction:
      type: string
      enum: [UP, DOWN, UNCHANGED]
    Venue:
      type: string
      enum: [HOSE, HNX, UPCOM]
    IndexCode:
      type: string
      enum: [VN_INDEX, VN30, HNX_INDEX, UPCOM_INDEX]
    RegimeLabel:
      type: string
      enum: [BULL, EARLY_BULL, SIDEWAYS, EARLY_BEAR, BEAR]
    ReasonCode:
      type: string
      minLength: 1
      pattern: "^[A-Z][A-Z0-9_]*$"
    Instant:
      type: string
      format: date-time
      description: RFC 3339 UTC instant.
      examples: ["2026-08-17T07:30:00Z"]
    NullableDecimal:
      oneOf:
        - type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal serialized as a JSON string to preserve precision.
        - type: "null"
    NullableCount:
      oneOf:
        - type: integer
          minimum: 0
        - type: "null"
    NullableScore:
      oneOf:
        - type: integer
          minimum: 0
          maximum: 100
        - type: "null"
