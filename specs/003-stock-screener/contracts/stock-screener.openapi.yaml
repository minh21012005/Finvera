openapi: 3.1.0
info:
  title: Finvera Stock Screener API
  version: 1.0.0
  description: >-
    Private Spring Boot contract for Feature 003 (Deterministic Stock
    Screener). Only the configured deployment owner may call this endpoint
    (SEC-001), under the same session Feature 001/002 already established
    (SEC-004 lineage).

    A screen is a single, transient, read-only query over facts and results
    Features 001/002 already accept and persist (`equity_profile`,
    `equity_daily_bar`, `technical_indicator_result`, `fundamental_summary`,
    `valuation_assessment`); nothing about a screen request is stored
    (research R-006). Filter evaluation semantics are normative in
    [screener-v1.md](screener-v1.md), not in this file.

    Every selected filter combines with logical AND (S-2). A stock that
    cannot be evaluated for a selected filter is excluded from the match set
    with a stated reason, never silently passed or dropped (FR-006, S-4).
    Authoritative decimals are transported as JSON strings (DATA-002).
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: Screener
    description: Deterministic multi-criteria screening over the supported universe.
paths:
  /screener/executions:
    post:
      operationId: executeScreen
      summary: Execute a deterministic screen against the supported stock universe
      description: >-
        FR-001 to FR-014. Expressed as a POST because the filter set is
        richer than practical query-string encoding and the operation is
        read-only (research R-009) — no resource is created or stored.
      tags: [Screener]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreenRequest"
      responses:
        "200":
          description: >-
            The result page, possibly empty (FR-013), possibly with one or
            more categories disclosed as unavailable (NFR-002, research
            R-011). Always HTTP 200 for a well-formed, successfully evaluated
            request — a degraded category is not an error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreenResponse"
        "400": { $ref: "#/components/responses/InvalidFilterRange" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: FINVERA_SESSION
      description: >-
        The owner session established by the Feature 001 private owner
        access contract. No separate authentication path exists for this
        feature (SEC-001).

  responses:
    InvalidFilterRange:
      description: >-
        A selected filter's own range is internally contradictory (e.g.
        `priceMin > priceMax`), research R-010. Rejected before any query
        runs; distinct from a legitimate empty result (FR-013).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthenticated:
      description: Missing, expired, or invalid private owner session.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: The authenticated caller is not the configured deployment owner.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ServerError:
      description: The service could not evaluate the screen.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    Decimal:
      type: string
      pattern: "^-?[0-9]+(\\.[0-9]+)?$"
      description: >-
        An exact decimal transported as a string, never a JSON number
        (DATA-002).
    Instant:
      type: string
      format: date-time
      description: UTC instant.
    DataStatus:
      type: string
      enum: [CURRENT, DELAYED, STALE, PARTIAL, UNAVAILABLE]
    CoherenceKey:
      type: string
      pattern: "^[0-9a-f]{32}$"
      description: >-
        Change detector over every current-revision row this screen's
        matches actually read (research R-008). Identical filters against
        unchanged accepted data reproduce an identical key (FR-010).
    ReasonCode:
      type: string
      description: >-
        A stable machine-readable code, e.g. `INSUFFICIENT_HISTORY`,
        `PRICE_UNAVAILABLE`, `SECTOR_UNCLASSIFIED`, `VALUATION_WITHHELD`.

    MarketFilter:
      type: object
      additionalProperties: false
      properties:
        exchange:
          type: array
          items: { type: string }
          description: e.g. HOSE, HNX, UPCOM.
        sectorId:
          type: array
          items: { type: string, format: uuid }
        marketCapMin: { $ref: "#/components/schemas/Decimal" }
        marketCapMax: { $ref: "#/components/schemas/Decimal" }

    PriceFilter:
      type: object
      additionalProperties: false
      properties:
        priceMin: { $ref: "#/components/schemas/Decimal" }
        priceMax: { $ref: "#/components/schemas/Decimal" }
        priceChangePercentMin: { $ref: "#/components/schemas/Decimal" }
        priceChangePercentMax: { $ref: "#/components/schemas/Decimal" }

    MaRelationship:
      type: string
      enum:
        - PRICE_ABOVE_MA20
        - PRICE_BELOW_MA20
        - PRICE_ABOVE_MA50
        - PRICE_BELOW_MA50
        - PRICE_ABOVE_MA200
        - PRICE_BELOW_MA200
        - MA20_ABOVE_MA50
        - MA20_BELOW_MA50
        - MA50_ABOVE_MA200
        - MA50_BELOW_MA200

    TechnicalFilter:
      type: object
      additionalProperties: false
      properties:
        rsiMin: { $ref: "#/components/schemas/Decimal" }
        rsiMax: { $ref: "#/components/schemas/Decimal" }
        macdSignal:
          type: string
          enum: [BULLISH, BEARISH, NEUTRAL]
        maRelationship:
          type: array
          items: { $ref: "#/components/schemas/MaRelationship" }
        volumeMin: { type: integer, minimum: 0 }
        volumeMax: { type: integer, minimum: 0 }
        relativeVolumeMin: { $ref: "#/components/schemas/Decimal" }
        relativeVolumeMax: { $ref: "#/components/schemas/Decimal" }
        breakout:
          type: string
          enum: [BREAKOUT_UP, BREAKOUT_DOWN]
        trend:
          type: string
          enum: [UPTREND, DOWNTREND, SIDEWAYS]

    FundamentalFilter:
      type: object
      additionalProperties: false
      properties:
        revenueGrowthPercentMin: { $ref: "#/components/schemas/Decimal" }
        revenueGrowthPercentMax: { $ref: "#/components/schemas/Decimal" }
        earningsGrowthPercentMin: { $ref: "#/components/schemas/Decimal" }
        earningsGrowthPercentMax: { $ref: "#/components/schemas/Decimal" }
        roeMin: { $ref: "#/components/schemas/Decimal" }
        roeMax: { $ref: "#/components/schemas/Decimal" }
        roaMin: { $ref: "#/components/schemas/Decimal" }
        roaMax: { $ref: "#/components/schemas/Decimal" }
        peMin: { $ref: "#/components/schemas/Decimal" }
        peMax: { $ref: "#/components/schemas/Decimal" }
        pbMin: { $ref: "#/components/schemas/Decimal" }
        pbMax: { $ref: "#/components/schemas/Decimal" }
        debtToEquityMin: { $ref: "#/components/schemas/Decimal" }
        debtToEquityMax: { $ref: "#/components/schemas/Decimal" }

    SortField:
      type: string
      enum:
        - SYMBOL
        - MARKET_CAP
        - PRICE
        - PRICE_CHANGE_PERCENT
        - RSI
        - RELATIVE_VOLUME
        - REVENUE_GROWTH_PERCENT
        - EARNINGS_GROWTH_PERCENT
        - ROE
        - ROA
        - PE
        - PB
        - DEBT_TO_EQUITY

    ScreenRequest:
      type: object
      additionalProperties: false
      properties:
        market: { $ref: "#/components/schemas/MarketFilter" }
        price: { $ref: "#/components/schemas/PriceFilter" }
        technical: { $ref: "#/components/schemas/TechnicalFilter" }
        fundamental: { $ref: "#/components/schemas/FundamentalFilter" }
        sortField:
          allOf: [{ $ref: "#/components/schemas/SortField" }]
          default: SYMBOL
        sortDirection:
          type: string
          enum: [ASC, DESC]
          default: ASC
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        offset:
          type: integer
          minimum: 0
          default: 0
      description: >-
        Every property is optional; an object with no filters selected in
        any category returns the full candidate universe (research R-007,
        R-009), paginated the same way as any other result.

    ScreenMatch:
      type: object
      required: [symbol, companyName, matchedValues, dataStatus]
      properties:
        symbol: { type: string }
        companyName: { type: string }
        exchange: { type: string }
        sectorName: { type: string, nullable: true }
        matchedValues:
          type: object
          additionalProperties: true
          description: >-
            The specific value(s) that satisfied every selected filter
            (FR-008), keyed by metric name (not by the request's min/max
            field name), e.g. `{"rsi": "68.42", "pe": "12.30"}`. Only metrics
            the request actually filtered on are present.
        dataStatus: { $ref: "#/components/schemas/DataStatus" }
        asOfTradingDate:
          type: string
          format: date

    CategoryDisclosure:
      type: object
      required: [category, status]
      properties:
        category:
          type: string
          enum: [MARKET, PRICE, TECHNICAL, FUNDAMENTAL]
        status: { $ref: "#/components/schemas/DataStatus" }
        reasonCode: { $ref: "#/components/schemas/ReasonCode" }
        excludedCount:
          type: integer
          description: >-
            Candidates excluded specifically because this category's
            selected filter(s) could not be evaluated for them (S-4).

    ScreenResponse:
      type: object
      required:
        - ruleVersion
        - matches
        - totalMatchCount
        - limit
        - offset
        - categoryDisclosures
        - coherenceKey
        - calculatedAt
      properties:
        ruleVersion:
          type: string
          const: screener-v1
        matches:
          type: array
          items: { $ref: "#/components/schemas/ScreenMatch" }
        totalMatchCount:
          type: integer
          description: Total matches before pagination (FR-011 sort applies to the full set).
        limit: { type: integer }
        offset: { type: integer }
        categoryDisclosures:
          type: array
          items: { $ref: "#/components/schemas/CategoryDisclosure" }
          description: >-
            One entry per category the request actually filtered on,
            disclosing whether that category's upstream data was fully,
            partially, or not evaluable (NFR-002).
        coherenceKey: { $ref: "#/components/schemas/CoherenceKey" }
        calculatedAt: { $ref: "#/components/schemas/Instant" }

    ErrorResponse:
      type: object
      required: [type, title, status, reasonCode, correlationId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        reasonCode: { $ref: "#/components/schemas/ReasonCode" }
        correlationId: { type: string }
